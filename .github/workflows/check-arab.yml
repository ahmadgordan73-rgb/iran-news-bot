name: check-arab-news
on: workflow_dispatch
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Arab News feed
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.parse, datetime
          base='https://cloud.feedly.com/v3/streams/contents?'+urllib.parse.urlencode({'streamId':'feed/https://www.arabnews.com/rss.xml','count':30})
          def get(url):
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
              try:
                  with urllib.request.urlopen(req,timeout=20) as r: return r.status,r.read()
              except Exception as e: return str(e),b''
          status, data=get(base); print('feedly status:',status)
          if status==200:
              j=json.loads(data); items=j.get('items',[]); print('feedly items:',len(items))
              for it in items[:3]:
                  href=(it.get('alternate') or [{}])[0].get('href','')
                  print('title:',it.get('title','')[:120], 'date:',it.get('published'), 'summary chars:',len((it.get('summary') or {}).get('content','')), 'url:',href)
              if items:
                  href=(items[0].get('alternate') or [{}])[0].get('href','')
                  if href: print('article direct status:',get(href)[0])
          status,_=get('https://www.arabnews.com/rss.xml'); print('official feed status:',status)
          PY
