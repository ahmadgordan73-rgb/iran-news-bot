name: check-arab-news
on: workflow_dispatch
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Test actual fallback
        run: |
          python - <<'PY'
          import bot, json
          f=next(x for x in json.load(open('feeds.json')) if x['name']=='Arab News')
          items=bot.fetch_arab_via_feedly(f)
          fresh=[x for x in items if bot.fresh_today(x)]
          relevant=[x for x in fresh if bot.KW.search(x['title']+' '+x['summary'])]
          print('feedly total:',len(items),'fresh today:',len(fresh),'keyword candidates:',len(relevant))
          for item in relevant[:3]: print('candidate:',item['title'],item['url'])
          if not items: raise SystemExit('No Feedly items')
          PY
